name: customer360-ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  public-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject private artifacts in the tracked tree
        run: |
          set -euo pipefail
          leaked=$(git ls-files | grep -E '(^|/)(outputs/|tmp-formal|dist-ci/|dist-m2-final/|\.private/|\.env$|data/hidden/|hidden_oracles\.yaml|hidden_profile\.json|generated_oracles\.yaml|.+\.duckdb$)' || true)
          if [ -n "$leaked" ]; then
            echo "private or generated artifacts are tracked:"
            echo "$leaked"
            exit 1
          fi
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f CODE_OF_CONDUCT.md
          test -f .gitignore
          grep -qF 'data/hidden/' .gitignore
          grep -qF 'outputs/' .gitignore
          grep -qF 'tmp-*/' .gitignore
          grep -qF '*.duckdb' .gitignore

  fast-gate-linux:
    runs-on: ubuntu-latest
    needs: public-tree
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.x"
      - name: Install locked environment
        run: uv sync --locked
      - name: Fast lint and unit/integration regression
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pytest -q -m "not slow"
          uv run c360 doctor
          uv run c360 audit-metadata
      - name: Build distributions
        run: uv build --out-dir dist-ci
      - name: Install wheel outside the source tree
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find dist-ci -name '*.whl' | head -n 1)
          test -n "$wheel"
          rm -rf /tmp/customer360-wheel-smoke /tmp/c360-wheel-cwd /tmp/c360-wheel-smoke-out
          uv venv /tmp/customer360-wheel-smoke
          uv pip install --python /tmp/customer360-wheel-smoke "$wheel"
          mkdir -p /tmp/c360-wheel-cwd
          cd /tmp/c360-wheel-cwd
          /tmp/customer360-wheel-smoke/bin/python -c "import customer360; from pathlib import Path; loaded=Path(customer360.__file__).resolve(); assert 'site-packages' in loaded.parts, loaded; assert 'src' not in loaded.parts, loaded; print(loaded)"
          /tmp/customer360-wheel-smoke/bin/c360 doctor
          /tmp/customer360-wheel-smoke/bin/c360 smoke --output /tmp/c360-wheel-smoke-out

  fast-gate-windows:
    runs-on: windows-latest
    needs: public-tree
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.x"
      - name: Install locked environment
        run: uv sync --locked
      - name: Windows fast regression
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pytest -q -m "not slow"
      - name: CLI smoke
        run: uv run c360 --help

  full-release-gate-linux:
    runs-on: ubuntu-latest
    needs: public-tree
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'full-test')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.x"
      - name: Install locked environment
        run: uv sync --locked
      - name: Full release regression (including slow 300-case and baseline tests)
        run: |
          uv run pytest -q

  postgres-integration:
    runs-on: ubuntu-latest
    needs: public-tree
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: customer360_test
          POSTGRES_USER: c360_tester
          POSTGRES_PASSWORD: c360_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.x"
      - name: Install locked environment and postgres driver
        run: |
          uv sync --locked
          uv pip install "psycopg[binary]"
      - name: Live PostgreSQL multi-engine equivalence integration test
        env:
          C360_TEST_PG_URI: "postgresql://c360_tester:c360_password@localhost:5432/customer360_test"
        run: |
          uv run pytest -q tests/test_dialects.py tests/test_postgres_live.py

  docker:
    runs-on: ubuntu-latest
    needs: fast-gate-linux
    steps:
      - uses: actions/checkout@v4
      - name: Build public image
        run: docker build --tag customer360:ci .
      - name: Verify non-root, no hidden data, read-only doctor
        run: |
          set -euo pipefail
          test "$(docker run --rm --network=none --read-only --entrypoint python customer360:ci -c 'import os; print(os.getuid())')" != "0"
          leaked=$(docker run --rm --network=none --read-only --entrypoint sh customer360:ci -c 'find /app -type f \( -name hidden_profile.json -o -name hidden_variant_manifest.json -o -name hidden_oracles.yaml -o -name generated_oracles.yaml -o -name "*.duckdb" -o -path "*/data/trusted/*" \)')
          if [ -n "$leaked" ]; then
            echo "hidden or trusted files found in image"
            echo "$leaked"
            exit 1
          fi
          docker run --rm --read-only --network=none --user 10001 customer360:ci doctor
      - name: Record docker runtime evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 .github/scripts/record_docker_runtime.py --image customer360:ci --output artifacts/docker_runtime_evidence.json
          docker run --rm --network=none --read-only --volume "$PWD/artifacts:/out:ro" --entrypoint /app/.venv/bin/python customer360:ci -c "from pathlib import Path; from customer360.contracts.evidence import DockerRuntimeEvidence; row=DockerRuntimeEvidence.model_validate_json(Path('/out/docker_runtime_evidence.json').read_text()); assert row.passed and row.docker_digest.startswith('sha256:'); print(row.docker_digest)"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-runtime-evidence
          path: artifacts/docker_runtime_evidence.json
          if-no-files-found: error
