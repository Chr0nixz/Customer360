name: customer360-release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject private artifacts in the tracked tree
        run: |
          set -euo pipefail
          leaked=$(git ls-files | grep -E '(^|/)(outputs/|tmp-formal|dist-ci/|dist-m2-final/|\.private/|\.env$|data/hidden/|hidden_oracles\.yaml|hidden_profile\.json|generated_oracles\.yaml|.+\.duckdb$)' || true)
          if [ -n "$leaked" ]; then
            echo "private or generated artifacts are tracked:"
            echo "$leaked"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Verify package reproducibility and packaging
        run: |
          uv sync --locked
          uv run pytest -q tests/test_public_tree.py tests/test_packaging.py

      - name: Build distribution packages
        run: |
          uv build

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          sha256sum customer360_agent_benchmark-* > SHA256SUMS
          cat SHA256SUMS

      - name: Resolve Release Tag & Notes
        id: resolve_notes
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag }}"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          NOTES_FILE="docs/releases/${TAG_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
          else
            echo "notes_file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_notes.outputs.tag_name }}
          name: "Customer360 Agent Benchmark ${{ steps.resolve_notes.outputs.tag_name }}"
          body_path: ${{ steps.resolve_notes.outputs.notes_file }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
